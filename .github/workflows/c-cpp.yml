name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: chmod +x runtest.sh
    - name: Clean
      run: make clean
    - name: Build
      run: make
    - name: Run
      run: ./runtest.sh
